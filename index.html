<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ירח דבש 2026 ✨</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Noto+Sans+Hebrew:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script>
        // If a country was already chosen, redirect immediately
        const last = localStorage.getItem('honeymoon-country');
        if (last === 'japan') location.replace('japan.html');
        else if (last === 'thailand') location.replace('thailand.html');
    </script>
</head>
<body class="selector-page">
    <div class="destination-selector">
        <div class="selector-header">
            <div class="selector-hearts">♥</div>
            <h1>ירח דבש 2026</h1>
            <p>27 ספטמבר – 24 באוקטובר · 28 ימים של הרפתקה</p>
        </div>

        <div class="selector-cards">
            <a href="japan.html" class="selector-card selector-japan"
               onclick="localStorage.setItem('honeymoon-country','japan')">
                <div class="selector-card-flag">🇯🇵</div>
                <div class="selector-card-title">יפן</div>
                <div class="selector-card-dates">27.09 – 10.10.2026</div>
                <div class="selector-card-cities">טוקיו · קיוטו · אוסקה</div>
                <div class="selector-card-days">14 ימים</div>
                <div class="selector-card-cta">פתחי לו״ז ←</div>
            </a>

            <a href="thailand.html" class="selector-card selector-thailand"
               onclick="localStorage.setItem('honeymoon-country','thailand')">
                <div class="selector-card-flag">🇹🇭</div>
                <div class="selector-card-title">תאילנד</div>
                <div class="selector-card-dates">10.10 – 24.10.2026</div>
                <div class="selector-card-cities">בנגקוק · ...</div>
                <div class="selector-card-days">14 ימים</div>
                <div class="selector-card-cta">פתחי לו״ז ←</div>
            </a>
        </div>

        <div class="selector-footer">✈️ בנינו ביחד את הטיול שתמיד חלמנו עליו ♥</div>
    </div>
</body>
</html>
